<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- How to link external css file to html file? -->
    <link rel="stylesheet" href="styles.css">

    <!-- Internal css -->
    <!-- <style>
        h1 {
            background-color: lightsteelblue;
        }
    </style> -->

    <!-- Adding external font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
</head>
<body>
    <h1>Learning css</h1>

    <!-- Inline css -->
    <p style="background-color: antiquewhite;">Hello how are you?</p>

    <h3 class="specificity", id="specs", style="color: purple;">This is to check on specifity</h3>

    <h4 style="font-family: 'Roboto', sans-serif;">This has external font applied</h4>

    <p style="font-size: larger; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; font-weight: 100;">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nihil, harum.</p>

    <p>This is an <em>important</em> point to note.</p>

    <p><strong>Warning:</strong> Proceed with caution.</p>


    <!-- Shortcut to create a div with class name start with .name, it will create a div with class name -->
    <div class="box", id="org">A</div>

    <div class="box", id="wht">B</div>

    <div class="box", id="grn">C</div>


    <img src="content.png" alt="learningContent", id="imgg">
</body>
</html>
