<body>
    <!-- Css Gradient => Smooth transition between 2 or more colors -->
    <!-- 3 Types of Gradient
    1. Linear (Goes up/down/left/right/diagonally)
    2. Radial (Defined by their center)
    3. Conic (Rotated around a center point) -->

    <div class="box">
        This is a linear gradient
    </div>

    <div class="myDiv">
        This is radial gradiant
    </div>

    <div class="div2">
        This is conic gradient
    </div>

    <!-- Css shadow effects -->
    <!-- 1. Text-Shadow 
    2. Box-Shadow -->
</body>
