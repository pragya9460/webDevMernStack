<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Flex box => It's a layout model using which space distribution can be done and has alignment capabilities.-->
    <!-- Shortcut => .container>.box*4{box-$} --> 
    <!--  => This type of things can be used to create a div named container, inside which it will have 4 divs names box with names box-numbers -->
    <div class="container">
        <div class="box" id="box-1">box-1</div>
        <div class="box" id="box-2">box-2</div>
        <div class="box" id="box-3">box-3</div>
        <div class="box" id="box-4">box-4</div>
    </div>

        <div class="box"><h1>box-1</h1></div>
        <div class="box"><h3>box-2</h3></div>
        <div class="box"><h2>box-3</h2></div>
        <div class="box">box-4</div>
    </div> -->
    
</body>
</html>
